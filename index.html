<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный план LE 2027 | GitHub Pages Ready</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --success-color: #16a34a;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --warning-color: #ea580c;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 130px;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        h1 { margin: 0 0 8px 0; color: #0f172a; font-size: 1.75rem; }
        p { margin: 4px 0; color: #64748b; font-size: 0.95rem; }

        .progress-container {
            margin-top: 15px;
            background: #e2e8f0;
            border-radius: 20px;
            height: 20px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            background: linear-gradient(90deg, #0284c7, #16a34a);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: 700;
            color: #0f172a;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: white;
            font-size: 0.9rem;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-outline { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); }
        .btn-outline:hover { background: #f1f5f9; }
        .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
        .btn-success { background: var(--success-color); }
        .btn-success:hover { background: #15803d; }

        /* Week Card & Collapsible Styling */
        .week-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--accent-color);
            transition: background 0.3s, border-color 0.3s;
        }

        .week-card.week-completed {
            border-left-color: var(--success-color);
            background-color: var(--success-bg);
            border-color: var(--success-border);
        }

        .week-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            user-select: none;
            transition: padding 0.2s;
        }

        .week-card.week-completed .week-header {
            border-bottom-color: var(--success-border);
        }

        .week-card.collapsed .week-header {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .week-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-arrow {
            font-size: 0.75rem;
            color: #64748b;
            transition: transform 0.2s ease;
        }

        .week-card.collapsed .toggle-arrow {
            transform: rotate(-90deg);
        }

        .week-title { font-weight: 700; font-size: 1.1rem; color: #0f172a; }

        .week-check-icon {
            display: none;
            font-size: 1.1rem;
        }

        .week-card.week-completed .week-check-icon {
            display: inline;
        }

        .tag {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            background: #e0f2fe;
            color: #0369a1;
            font-weight: 600;
        }

        .week-card.week-completed .tag {
            background: #dcfce7;
            color: #15803d;
        }

        .day-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .week-card.collapsed .day-list {
            display: none;
        }

        /* Day Item Styling */
        .day-item {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 12px;
            align-items: start;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #f1f5f9;
            position: relative;
        }

        .week-card.week-completed .day-item {
            background: #ffffff;
            border-color: #d1fae5;
        }

        .day-item.completed {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .day-item.completed .day-title {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .checkbox-custom {
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin-top: 3px;
        }

        .day-header-line {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .day-title { font-weight: 600; color: #0f172a; }
        .day-time { font-size: 0.8rem; color: #64748b; font-weight: normal; }
        
        .info-pop-trigger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e0f2fe;
            color: #0284c7;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            position: relative;
        }
        .info-pop-trigger:hover { background: #bae6fd; }

        .popup-card {
            display: none;
            position: absolute;
            top: 30px;
            left: 0;
            z-index: 100;
            width: 320px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-radius: 8px;
            padding: 14px;
            font-size: 0.82rem;
            color: #334155;
        }

        .info-pop-trigger:hover .popup-card,
        .popup-card.active {
            display: block;
        }

        .popup-title { font-weight: 700; color: #0f172a; margin-bottom: 6px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; }
        .popup-section { margin-bottom: 6px; }
        .popup-section strong { color: #0284c7; }

        .day-lepolek {
            font-size: 0.8rem;
            color: #0369a1;
            background: #f0f9ff;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 6px;
            border: 1px solid #bae6fd;
        }

        /* Collapsible Notes */
        .notes-wrapper { margin-top: 8px; }
        .note-toggle-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .note-toggle-btn.has-note {
            background: #fef3c7;
            border-color: #fde047;
            color: #b45309;
            font-weight: 600;
        }

        .note-input-container {
            display: none;
            margin-top: 8px;
            background: #ffffff;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .note-textarea {
            width: 100%;
            height: 60px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px;
            font-size: 0.85rem;
            box-sizing: border-box;
            resize: vertical;
        }

        .note-actions {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 6px;
        }

        /* Fixed Pomodoro Widget */
        .pomodoro-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: #ffffff;
            border: 2px solid #0284c7;
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 230px;
            text-align: center;
        }

        .pomo-header {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .pomo-timer {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0f172a;
            font-family: monospace;
            margin: 4px 0;
        }

        .pomo-status {
            font-size: 0.75rem;
            font-weight: 600;
            color: #0284c7;
            margin-bottom: 8px;
        }

        .pomo-controls {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .pomo-mode-btns {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 8px;
            border-top: 1px solid #f1f5f9;
            padding-top: 6px;
        }

        .audio-test-btn {
            font-size: 0.65rem;
            color: #0284c7;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 4px;
            display: block;
            width: 100%;
        }

        @media (max-width: 600px) {
            .pomodoro-widget {
                bottom: 10px;
                right: 10px;
                width: 190px;
                padding: 8px 10px;
            }
            .pomo-timer { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>План подготовки к LEK / Нострификации (Цель: Июнь 2027)</h1>
        <p><strong>Цикл 1 (12 недель):</strong> Полное покрытие базы CEM + High-Yield Польские Гайдлайны + Zeszyt Błędów</p>
        <p><strong>Режим:</strong> 2.5–3 ч в будни (3 блока) | 1.5 ч в субботу | Воскресенье — Выходной</p>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0% выполнено</div>
        </div>
    </header>

    <div class="controls">
        <select class="filter-select" id="subjectFilter" onchange="filterWeeks()">
            <option value="all">Все предметы (12 недель)</option>
            <option value="interna">Терапия (Choroby wewnętrzne)</option>
            <option value="ratunkowa">Неотложная медицина (Ratunkowa)</option>
            <option value="chirurgia">Хирургия (Chirurgia)</option>
            <option value="ginekologia">Акушерство и Гинекология</option>
            <option value="pediatria">Педиатрия (Pediatria)</option>
            <option value="rodzinna">Семейная медицина (Medycyna Rodzinna)</option>
            <option value="psychiatria_neurologia">Психиатрия, Неврология и Дерматология</option>
            <option value="prawo_powtorka">Право, Этика и Симуляции</option>
        </select>

        <button class="btn btn-outline" onclick="collapseAllWeeks()">Свернуть все</button>
        <button class="btn btn-outline" onclick="expandAllWeeks()">Развернуть все</button>
        <button class="btn btn-outline" onclick="resetProgress()">Сбросить прогресс</button>
    </div>

    <div id="planContainer"></div>
</div>

<!-- Floating Pomodoro Widget -->
<div class="pomodoro-widget">
    <div class="pomo-header">LEK Pomodoro Timer</div>
    <div class="pomo-status" id="pomoStatus">Учеба (Блок 45 мин)</div>
    <div class="pomo-timer" id="pomoDisplay">45:00</div>
    
    <div class="pomo-controls">
        <button class="btn btn-sm" id="pomoStartBtn" onclick="togglePomodoro()">Старт</button>
        <button class="btn btn-sm btn-outline" onclick="resetPomodoro()">Сброс</button>
    </div>

    <div class="pomo-mode-btns">
        <button class="btn btn-sm btn-outline" style="font-size: 0.65rem;" onclick="setPomoMode(45, 'Учеба (45 мин)')">45м Учеба</button>
        <button class="btn btn-sm btn-outline" style="font-size: 0.65rem;" onclick="setPomoMode(10, 'Отдых (10 мин)')">10м Отдых</button>
    </div>
    <button class="audio-test-btn" onclick="testAlarmSound()">🔔 Проверить звук будильника</button>
</div>

<script>
const planData = [

/* LocalStorage Handlers */
function loadProgress() {
    return JSON.parse(localStorage.getItem('nostryfikacja_progress')) || {};
}

function loadNotes() {
    return JSON.parse(localStorage.getItem('nostryfikacja_notes')) || {};
}

function loadCollapsedState() {
    return JSON.parse(localStorage.getItem('nostryfikacja_collapsed')) || {};
}

function saveProgress(id, isChecked) {
    const progress = loadProgress();
    progress[id] = isChecked;
    localStorage.setItem('nostryfikacja_progress', JSON.stringify(progress));
    updateProgressBar();
}

function saveNote(id, text) {
    const notes = loadNotes();
    notes[id] = text;
    localStorage.setItem('nostryfikacja_notes', JSON.stringify(notes));
    renderPlan();
}

function saveCollapsedState(weekNum, isCollapsed) {
    const state = loadCollapsedState();
    state[weekNum] = isCollapsed;
    localStorage.setItem('nostryfikacja_collapsed', JSON.stringify(state));
}

/* Render & Filter Function */
function renderPlan() {
    const container = document.getElementById('planContainer');
    const filter = document.getElementById('subjectFilter').value;
    const progress = loadProgress();
    const notes = loadNotes();
    const collapsedState = loadCollapsedState();

    container.innerHTML = '';

    planData.forEach(week => {
        if (filter !== 'all' && week.subject !== filter) return;

        const isWeekCompleted = week.days.every(d => !!progress[d.id]);
        const isCollapsed = !!collapsedState[week.week];

        const weekCard = document.createElement('div');
        weekCard.className = `week-card ${isWeekCompleted ? 'week-completed' : ''} ${isCollapsed ? 'collapsed' : ''}`;
        weekCard.id = `week-card-${week.week}`;

        let daysHtml = '';
        week.days.forEach(day => {
            const isChecked = !!progress[day.id];
            const noteText = notes[day.id] || '';
            const hasNote = noteText.trim().length > 0;

            daysHtml += `
                <div class="day-item ${isChecked ? 'completed' : ''}" id="item-${day.id}">
                    <input type="checkbox" class="checkbox-custom" id="check-${day.id}" ${isChecked ? 'checked' : ''} onchange="toggleDay('${day.id}', ${week.week})">
                    
                    <div>
                        <div class="day-header-line">
                            <span class="day-title">${day.title}</span>
                            <span class="day-time">(${day.time})</span>
                            
                            <div class="info-pop-trigger" onclick="togglePopup(event, 'pop-${day.id}')">
                                ℹ️
                                <div class="popup-card" id="pop-${day.id}">
                                    <div class="popup-title">🎯 Раздел High-Yield LEK</div>
                                    <div class="popup-section"><strong>Что изучает:</strong> ${day.popup.what}</div>
                                    <div class="popup-section"><strong>Ловушки CEM / Акцент:</strong> ${day.popup.focus}</div>
                                    <div class="popup-section"><strong>Источники:</strong> ${day.popup.reading}</div>
                                </div>
                            </div>
                        </div>

                        <div class="day-lepolek">📍 ${day.lepolekPath}</div>

                        <!-- Collapsible Note Area -->
                        <div class="notes-wrapper">
                            <button class="note-toggle-btn ${hasNote ? 'has-note' : ''}" onclick="toggleNoteInput('${day.id}')">
                                ${hasNote ? '📝 Заметка [Заполнена]' : '📝 + Добавить заметку'}
                            </button>

                            <div class="note-input-container" id="note-box-${day.id}">
                                <textarea class="note-textarea" id="note-text-${day.id}" placeholder="Запишите термины, дозировки или сложные моменты...">${noteText}</textarea>
                                <div class="note-actions">
                                    <button class="btn btn-sm btn-outline" onclick="toggleNoteInput('${day.id}')">Отмена</button>
                                    <button class="btn btn-sm btn-success" onclick="submitNote('${day.id}')">ОК / Сохранить</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });

        weekCard.innerHTML = `
            <div class="week-header" onclick="toggLEKeekCollapse(${week.week})">
                <div class="week-title-box">
                    <span class="toggle-arrow">▼</span>
                    <span class="week-title">${week.title}</span>
                    <span class="week-check-icon">✅</span>
                </div>
                <span class="tag">${week.subject.toUpperCase()}</span>
            </div>
            <div class="day-list">
                ${daysHtml}
            </div>
        `;

        container.appendChild(weekCard);
    });

    updateProgressBar();
}

function toggleDay(id, weekNum) {
    const checkbox = document.getElementById(`check-${id}`);
    const item = document.getElementById(`item-${id}`);
    if (checkbox.checked) {
        item.classList.add('completed');
    } else {
        item.classList.remove('completed');
    }
    saveProgress(id, checkbox.checked);
    updateWeekCompletionStatus(weekNum);
}

function updateWeekCompletionStatus(weekNum) {
    const week = planData.find(w => w.week === weekNum);
    if (!week) return;

    const progress = loadProgress();
    const isCompleted = week.days.every(d => !!progress[d.id]);
    const card = document.getElementById(`week-card-${weekNum}`);

    if (card) {
        if (isCompleted) {
            card.classList.add('week-completed');
        } else {
            card.classList.remove('week-completed');
        }
    }
}

function toggLEKeekCollapse(weekNum) {
    const card = document.getElementById(`week-card-${weekNum}`);
    if (!card) return;
    const isNowCollapsed = card.classList.toggle('collapsed');
    saveCollapsedState(weekNum, isNowCollapsed);
}

function collapseAllWeeks() {
    planData.forEach(week => {
        const card = document.getElementById(`week-card-${week.week}`);
        if (card) {
            card.classList.add('collapsed');
            saveCollapsedState(week.week, true);
        }
    });
}

function expandAllWeeks() {
    planData.forEach(week => {
        const card = document.getElementById(`week-card-${week.week}`);
        if (card) {
            card.classList.remove('collapsed');
            saveCollapsedState(week.week, false);
        }
    });
}

function toggleNoteInput(id) {
    const box = document.getElementById(`note-box-${id}`);
    if (box.style.display === 'block') {
        box.style.display = 'none';
    } else {
        box.style.display = 'block';
    }
}

function submitNote(id) {
    const text = document.getElementById(`note-text-${id}`).value;
    saveNote(id, text);
}

function togglePopup(e, popId) {
    e.stopPropagation();
    const popup = document.getElementById(popId);
    popup.classList.toggle('active');
}

document.addEventListener('click', () => {
    document.querySelectorAll('.popup-card').forEach(p => p.classList.remove('active'));
});

function updateProgressBar() {
    const progress = loadProgress();
    let totalDays = 0;
    let completedDays = 0;

    planData.forEach(week => {
        week.days.forEach(day => {
            totalDays++;
            if (progress[day.id]) completedDays++;
        });
    });

    const percentage = Math.round((completedDays / totalDays) * 100) || 0;
    document.getElementById('progressBar').style.width = percentage + '%';
    document.getElementById('progressText').innerText = `${percentage}% выполнено (${completedDays}/${totalDays} дней)`;
}

function filterWeeks() {
    renderPlan();
}

function resetProgress() {
    if (confirm("Вы уверены, что хотите полностью сбросить отмеченный прогресс, заметки и состояние разделов?")) {
        localStorage.removeItem('nostryfikacja_progress');
        localStorage.removeItem('nostryfikacja_notes');
        localStorage.removeItem('nostryfikacja_collapsed');
        renderPlan();
    }
}

/* ==========================================================
   BACKGROUND AUDIO ALARM & NOTIFICATIONS ENGINE
   ========================================================== */

let audioCtx = null;
let titleFlashInterval = null;
const originalTitle = document.title;

function initAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function requestNotificationPermission() {
    if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
    }
}

function playLoudAlarmSound() {
    initAudioContext();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const pulses = [0.0, 0.15, 0.5, 0.65, 1.0, 1.15, 1.5, 1.65, 2.0, 2.15];

    pulses.forEach(startTime => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now + startTime);
        osc.frequency.setValueAtTime(1318.51, now + startTime + 0.05);
        
        gain.gain.setValueAtTime(0, now + startTime);
        gain.gain.linearRampToValueAtTime(0.4, now + startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + startTime + 0.12);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(now + startTime);
        osc.stop(now + startTime + 0.12);
    });
}

function testAlarmSound() {
    initAudioContext();
    playLoudAlarmSound();
}

function startTitleFlashing() {
    stopTitleFlashing();
    let flag = false;
    titleFlashInterval = setInterval(() => {
        document.title = flag ? "⏰ ВРЕМЯ ИСТЕКЛО!" : "🔔 LEK Pomodoro";
        flag = !flag;
    }, 700);
}

function stopTitleFlashing() {
    if (titleFlashInterval) {
        clearInterval(titleFlashInterval);
        titleFlashInterval = null;
    }
    document.title = originalTitle;
}

function sendDesktopNotification(message) {
    if ("Notification" in window && Notification.permission === "granted") {
        new Notification("LEK Pomodoro Будильник", {
            body: message,
            icon: "https://cdn-icons-png.flaticon.com/512/1827/1827315.png"
        });
    }
}

/* Pomodoro Timer Engine */
let pomoSeconds = 45 * 60;
let pomoInterval = null;
let isPomoRunning = false;

function updatePomoDisplay() {
    const mins = Math.floor(pomoSeconds / 60);
    const secs = pomoSeconds % 60;
    document.getElementById('pomoDisplay').innerText = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function togglePomodoro() {
    initAudioContext();
    requestNotificationPermission();
    stopTitleFlashing();

    const startBtn = document.getElementById('pomoStartBtn');
    if (isPomoRunning) {
        clearInterval(pomoInterval);
        isPomoRunning = false;
        startBtn.innerText = 'Старт';
        startBtn.classList.remove('btn-success');
    } else {
        isPomoRunning = true;
        startBtn.innerText = 'Пауза';
        startBtn.classList.add('btn-success');
        
        pomoInterval = setInterval(() => {
            if (pomoSeconds > 0) {
                pomoSeconds--;
                updatePomoDisplay();
            } else {
                clearInterval(pomoInterval);
                isPomoRunning = false;
                startBtn.innerText = 'Старт';
                startBtn.classList.remove('btn-success');
                
                playLoudAlarmSound();
                startTitleFlashing();
                sendDesktopNotification("Время блока истекло! Сделайте перерыв или перейдите к следующему шагу.");
            }
        }, 1000);
    }
}

function resetPomodoro() {
    clearInterval(pomoInterval);
    isPomoRunning = false;
    pomoSeconds = 45 * 60;
    stopTitleFlashing();
    document.getElementById('pomoStatus').innerText = 'Учеба (Блок 45 мин)';
    document.getElementById('pomoStartBtn').innerText = 'Старт';
    document.getElementById('pomoStartBtn').classList.remove('btn-success');
    updatePomoDisplay();
}

function setPomoMode(minutes, statusText) {
    initAudioContext();
    requestNotificationPermission();
    clearInterval(pomoInterval);
    isPomoRunning = false;
    pomoSeconds = minutes * 60;
    stopTitleFlashing();
    document.getElementById('pomoStatus').innerText = statusText;
    document.getElementById('pomoStartBtn').innerText = 'Старт';
    document.getElementById('pomoStartBtn').classList.remove('btn-success');
    updatePomoDisplay();
}

document.addEventListener('DOMContentLoaded', () => {
    renderPlan();
    updatePomoDisplay();
});
</script>
